:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#123C85; --brand-line:#123C85;
  --go:#5E79AF; --info:#1F5FD1; --danger:#C62F2B; --amber:#A3B6DE;
  --ink:#080F1D; --ink-2:#4F5B76; --line:#D6DEEA;
  --surface:#FFFFFF; --soft:#F2F5FB; --canvas:#DFE6F1;
  --map-bg:#E6EDF5; --map-road:#FFFFFF; --map-sea:#BCD4EC; --map-park:#CDE5D0;
  --go-soft:#E4F4EA; --info-soft:#E6EEFC; --danger-soft:#FBE9E8; --amber-soft:#FFF4DA;
  --fs:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-line:#8DB0FF; --go:#1E9150; --info:#3A72E0; --danger:#D23C35;
    --ink:#EAF0FA; --ink-2:#AAB6CC; --line:#2C3A57;
    --surface:#121B2D; --soft:#1A2540; --canvas:#070D19;
    --map-bg:#1B263D; --map-road:#2B3A58; --map-sea:#12314F; --map-park:#1C3A2B;
    --go-soft:#16331F; --info-soft:#172A4D; --danger-soft:#3A1B1B; --amber-soft:#3A2F12;
  }
}
:root[data-theme="dark"]{
  --brand-line:#8DB0FF; --go:#1E9150; --info:#3A72E0; --danger:#D23C35;
  --ink:#EAF0FA; --ink-2:#AAB6CC; --line:#2C3A57;
  --surface:#121B2D; --soft:#1A2540; --canvas:#070D19;
  --map-bg:#1B263D; --map-road:#2B3A58; --map-sea:#12314F; --map-park:#1C3A2B;
  --go-soft:#16331F; --info-soft:#172A4D; --danger-soft:#3A1B1B; --amber-soft:#3A2F12;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);
  font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.device{position:relative;width:390px;height:min(844px,100%);background:var(--surface);border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 10px #0B1426,0 28px 60px rgba(8,18,45,.35);font-size:var(--fs);line-height:1.4}
@media (max-width:520px){.stage{padding:0}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}
#app{height:100%;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1:focus{outline:none}
.ic{flex:none}

/* Encabezado */
.hdr{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;min-height:64px}
.ttl{flex:1;margin:0;font-size:1.15em;line-height:1.2}
.backbtn{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 10px 0 4px;border:0;background:none;border-radius:12px;cursor:pointer;font-weight:700;color:var(--info)}
.backbtn:active{background:var(--soft)}
.sos{min-width:56px;min-height:44px;border:0;border-radius:22px;background:var(--danger);color:#fff;font-weight:700;letter-spacing:.04em;cursor:pointer;padding:0 14px}
.logo{border:0;background:none;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink)}
.word{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-weight:800;letter-spacing:-.03em}
.word .u{color:var(--amber)}
.logo .word{font-size:1.45em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.9em}

/* Contenido y pie */
.content{flex:1;overflow-y:auto;padding:4px 20px 24px;-webkit-overflow-scrolling:touch}
.content.flush{padding:0}
.content.center{display:flex;flex-direction:column;justify-content:center}
.foot{padding:12px 20px 18px;border-top:1px solid var(--line);background:var(--surface)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.nav button{flex:1;min-height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8em;font-weight:700;color:var(--ink-2);cursor:pointer}
.nav button[aria-current="page"]{color:var(--info)}
.offline{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--amber-soft);color:var(--ink);font-size:.85em;font-weight:700}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px 18px;border:0;border-radius:16px;font-weight:700;font-size:1em;cursor:pointer;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-go{background:var(--go);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-ghost.red{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{min-height:68px;font-size:1.08em}
.btn-link{background:none;border:0;color:var(--info);font-weight:700;min-height:44px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-link.inline{min-height:0;padding:0}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.center-link{display:block;margin:12px auto 0}

/* Formularios */
.field{margin-bottom:16px}
.field>label{display:block;font-weight:700;margin-bottom:6px}
.inwrap{position:relative;display:flex;align-items:center}
.prefix{position:absolute;left:14px;color:var(--ink-2);font-weight:700;pointer-events:none;display:flex}
.prefix+.input{padding-left:58px}
.prefix.i+.input{padding-left:46px}
.suffix{position:absolute;right:6px;min-height:40px;padding:0 10px;border:0;background:none;color:var(--info);font-weight:700;cursor:pointer;border-radius:10px}
.input{width:100%;min-height:54px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.input.pw{padding-right:92px}
.input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 25%,transparent)}
.msg{font-size:.85em;margin:6px 0 0;color:var(--ink-2)}
.field.err .input{border-color:var(--danger)}
.field.err .msg{color:var(--danger);font-weight:700}
.checkrow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:400}
.checkrow input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--go)}
#code,#rcode{font-size:1.6em;letter-spacing:.5em;text-align:center;font-weight:700}
.alert{padding:12px 14px;border-radius:14px;background:var(--danger-soft);color:var(--ink);border-left:5px solid var(--danger);margin-bottom:16px;font-size:.92em}
.note{padding:12px 14px;border-radius:14px;background:var(--info-soft);font-size:.9em;margin-bottom:16px}
.lead{font-size:1.02em;color:var(--ink-2);margin:0 0 20px}
.fine{font-size:.8em;color:var(--ink-2);text-align:center;margin:12px 0 0}

/* Bienvenida */
.hero{text-align:center;padding:10px 6px}
.hero-mark{width:176px;height:176px;margin:0 auto 18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.hero .word{font-size:3.1em;line-height:1;margin:0;background:none;border:0;color:var(--ink);cursor:default}
.hero .tag{margin:6px 0 20px;font-size:1.1em;color:var(--ink-2)}

/* Inicio */
.greet{margin:6px 0 0;color:var(--ink-2);font-size:1em}
.q{margin:2px 0 16px;font-size:1.45em;line-height:1.2}
.lvl{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border:2px solid var(--line);border-radius:20px;background:var(--surface);color:var(--brand-line);font-weight:700;font-size:.78em;cursor:pointer;min-height:40px}
.lvl span{color:var(--ink)}
.dest{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;margin-bottom:12px;padding:14px 16px;border:0;border-radius:20px;background:var(--go);color:#fff;text-align:left;cursor:pointer}
.dest-ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.dest-tx{flex:1;display:flex;flex-direction:column;min-width:0}
.dest-n{font-weight:700;font-size:1.1em}
.dest-a{font-size:.8em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-p{font-weight:700;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:12px;font-size:.9em;white-space:nowrap}
.empty{padding:20px;border:2px dashed var(--line);border-radius:18px;text-align:center;margin-bottom:14px}
.empty p{margin:0 0 14px;color:var(--ink-2)}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--soft);cursor:pointer;color:var(--ink-2);font-weight:700;text-align:left;margin:14px 0}
.sec{font-size:1em;margin:22px 0 10px}
.favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px 6px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.82em;text-align:center;color:var(--ink)}
.fav svg{color:var(--go)}
.fav-add svg{color:var(--info)}
.fav[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.85em;color:var(--ink)}
.chip svg{color:var(--go)}
.chip.on{background:var(--go-soft);border-color:var(--go)}
.mapbox{position:relative;height:180px;overflow:hidden;background:var(--map-bg)}
.mapbox.r{border-radius:18px}
.mapbox.tall{height:300px}
.mapbox.trip{height:300px}
.map{width:100%;height:100%;display:block}
.floating{position:absolute;left:16px;right:16px;bottom:14px}
.floating .searchbar{margin:0;background:var(--surface);box-shadow:0 8px 20px rgba(10,25,60,.18)}
.hint{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--amber-soft);margin:10px 0}
.hint p{margin:0;font-weight:700}

/* Listas */
.list{list-style:none;margin:0;padding:0}
.rowb{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.rowb .t{flex:1;display:flex;flex-direction:column;min-width:0}
.rowb .t b{font-weight:700}
.rowb .t small{color:var(--ink-2);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .lead-ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--info);flex:none}
.rowb .lead-ic.g{color:var(--go)}
.rowb .lead-ic.r{color:var(--danger)}
.rowact{display:flex;align-items:center;gap:4px}
.icon-btn{min-width:48px;min-height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:active{background:var(--soft)}
.badge{font-size:.72em;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--go-soft);color:var(--ink);white-space:nowrap}
.badge.x{background:var(--danger-soft)}
.badge.d{background:var(--info-soft)}
.profile-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--soft);margin:6px 0 10px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2em;flex:none}

/* Confirmación */
.route{padding:14px 16px;border-radius:18px;background:var(--soft);margin:14px 0}
.rp{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.rp+.rp{border-top:1px dashed var(--line)}
.dot{width:14px;height:14px;border-radius:50%;margin-top:6px;flex:none}
.dot.o{background:var(--info)}
.dot.d{background:var(--go)}
.rl{display:block;font-size:.78em;color:var(--ink-2);font-weight:700}
.rv{display:block;font-weight:700}
.ra{display:block;font-size:.82em;color:var(--ink-2)}
.fare{padding:16px;border-radius:18px;border:2px solid var(--go);background:var(--go-soft);margin-bottom:14px}
.fare .amt{font-size:2em;font-weight:700;margin:2px 0}
.fare p{margin:0}
.svc{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.svc[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.svc .t{flex:1}
.svc .t b{display:block}
.svc .t small{color:var(--ink-2);font-size:.8em}
.svc .p{font-weight:700}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;flex:none}
[aria-checked="true"] .radio{border-color:var(--go)}
[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--go)}
.offer{padding:14px;border-radius:16px;border:2px solid var(--line);margin-bottom:14px}
.offer>p{margin:0 0 10px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.5em;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper output{flex:1;text-align:center;font-size:1.5em;font-weight:700}
.offer .msg.warn{color:var(--danger);font-weight:700}
.payrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.payrow span.t{flex:1}
.payrow .chg{color:var(--info);font-weight:700}

/* Buscando */
.pulse{width:150px;height:150px;margin:0 auto 26px;border-radius:50%;background:var(--info-soft);display:grid;place-items:center;position:relative}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--info);animation:ring 2.2s ease-out infinite;opacity:0}
.pulse::after{animation-delay:1.1s}
.pulse .core{width:70px;height:70px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.big-t{font-size:1.35em;margin:0 0 8px;text-align:center}
.sub-t{text-align:center;color:var(--ink-2);margin:0}

/* Viaje */
.tpanel{padding:16px 20px}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--go)}
.tstat{font-size:1.3em;margin:0;line-height:1.2}
.tsub{margin:4px 0 14px;color:var(--ink-2)}
.driver{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:12px}
.plate{margin-left:auto;text-align:right}
.plate b{display:inline-block;white-space:nowrap;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;font-size:1.05em;letter-spacing:.06em;background:var(--surface)}
.plate small{display:block;color:var(--ink-2);font-size:.78em;margin-top:4px}

/* Calificación */
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.star{width:56px;height:56px;border:0;background:none;cursor:pointer;color:var(--line);display:grid;place-items:center}
.star svg{width:44px;height:44px}
.star.on{color:var(--amber)}
.star.on svg{fill:var(--amber)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--ink-2)}
.kv b{text-align:right}

/* Ajustes */
.radiocard{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.radiocard[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.radiocard b{display:block}
.radiocard small{color:var(--ink-2);font-size:.82em}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;min-height:52px;border:0;border-radius:11px;background:none;cursor:pointer;font-weight:700;color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(10,25,60,.15)}
details{border-bottom:1px solid var(--line)}
summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none;padding:8px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.3em;color:var(--info)}
details[open] summary::after{content:"–"}
details p{margin:0 0 14px;color:var(--ink-2)}

/* Capas */
#overlay{position:absolute;inset:0;z-index:30;display:none}
#overlay.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(6,14,32,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 22px}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 8px;font-size:1.25em}
.sheet p{color:var(--ink-2);margin:0 0 16px}
.sheet.wiz{background:#0E1626;color:#E9EEF8;font-size:15px}
.sheet.wiz h2,.sheet.wiz b{color:#fff}
.sheet.wiz p,.sheet.wiz small{color:#9FB0CC}
.wizgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px}
.wizgrid button,.wizrow button{min-height:44px;border-radius:10px;border:1px solid #33456A;background:#16223A;color:#E9EEF8;cursor:pointer;font-weight:700;font-size:.9em}
.wizgrid button[aria-pressed="true"],.wizrow button[aria-pressed="true"]{background:#A3B6DE;color:#080F1D;border-color:#A3B6DE}
.wizrow{display:flex;gap:6px;margin:6px 0 14px}
.wizrow button{flex:1}
.wiz textarea{width:100%;height:120px;border-radius:10px;border:1px solid #33456A;background:#0A111F;color:#CFE0FF;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:8px}
.adapt{text-align:center}
.adapt .bk{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px;color:var(--brand-line)}
.callscreen{text-align:center;padding:10px 0}
.callscreen .avatar{width:84px;height:84px;margin:0 auto 12px;font-size:1.6em}
#toast{position:absolute;left:16px;right:16px;top:70px;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#080F1D;color:#fff;font-size:.9em;font-weight:700;
  transform:translateY(-16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast span{flex:1}
.toast-act{border:0;background:none;color:var(--amber);font-weight:700;cursor:pointer;min-height:40px;padding:0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2: mapas reales, conductor y estados de red ---- */
.lmap{width:100%;height:100%;background:var(--map-bg)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:9px!important}
.pin-o{width:18px;height:18px;border-radius:50%;background:var(--info);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--info) 25%,transparent)}
.pin-d{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--go);border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin-car{width:34px;height:34px;border-radius:50%;background:var(--brand);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.originbar{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:var(--soft);cursor:pointer;text-align:left;color:var(--ink);margin:10px 0}
.originbar .t{flex:1;min-width:0}.originbar small{display:block;color:var(--ink-2);font-size:.75em;font-weight:700}
.originbar b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.paychip{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);margin:8px 0}
.paychip .t{flex:1}.paychip .chg{color:var(--info);font-weight:700;font-size:.9em}
.label-s{font-weight:700;margin:16px 0 8px;font-size:.95em}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--info);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:14px 0}
.gbtn{display:flex;justify-content:center;min-height:44px;margin-top:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.85em;margin:14px 0 4px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.seg3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.req{padding:14px;border:2px solid var(--line);border-radius:16px;margin-bottom:12px}
.req .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.req .amt{font-size:1.4em;font-weight:700}
.online-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--go);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.devcode{padding:10px 14px;border-radius:12px;background:var(--amber-soft);font-weight:700;margin-bottom:14px}
a.btn{text-decoration:none}
select.input{appearance:auto}
#mp-brick{min-height:300px}

/* Leaflet 1.9.4 (estilos incrustados) */
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
.leaflet-tile::selection {
	background: transparent;
}
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}
.leaflet-container img.leaflet-tile {
	mix-blend-mode: plus-lighter;
}
.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;

/* Versión final: elegir conductor, ofertas y plano simulado */
.ofr{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--surface);animation:pop .35s ease-out}
.ofr.rec{border-color:var(--go)}
.ofr-top{display:flex;gap:12px;align-items:center}
.ofr-top .who{flex:1;min-width:0}.ofr-top .who b{display:block}
.ofr-top small{display:block;color:var(--ink-2);font-size:.82em}
.ofr .pr{text-align:right}.ofr .pr b{display:block;font-size:1.35em}
.ofr .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.badge.a{background:var(--amber-soft)}
.stat{flex:1;padding:12px 14px;border-radius:16px;background:var(--soft)}.stat span{display:block;font-size:.8em;color:var(--ink-2);font-weight:700}.stat b{font-size:1.3em}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.maplbl{font-size:10px;font-weight:700;color:var(--ink-2);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;opacity:.8;transform:translate(-50%,-50%);pointer-events:none}

/* ---------------------------------------------------------------- Validación (igual que el servidor real) */
function cleanName(v) {
  var s = String(v || '').trim().replace(/\s+/g, ' ');
  if (s.length < 5 || s.length > 60) throw bad('Escribe tu nombre y apellido (entre 5 y 60 letras).', 'name');
  if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/.test(s)) throw bad('El nombre solo puede tener letras y espacios.', 'name');
  if (s.split(' ').filter(function (w) { return w.length >= 2; }).length < 2) throw bad('Escribe tu nombre y al menos un apellido.', 'name');
  return s;
}
function normPhone(raw, field) {
  field = field || 'phone';
  var d = String(raw || '').replace(/\D/g, '');
  if (d.length === 11 && d.indexOf('51') === 0) d = d.slice(2);
  if (!/^9\d{8}$/.test(d)) throw bad('Ese número no parece un celular peruano real. Debe tener 9 dígitos y empezar con 9.', field);
  var asc = '0123456789012345678', desc = '9876543210987654321';
  if (/(\d)\1{5,}/.test(d) || asc.indexOf(d) > -1 || desc.indexOf(d) > -1 || asc.indexOf(d.slice(1)) > -1 || desc.indexOf(d.slice(1)) > -1)
    throw bad('Ese número parece inventado (por ejemplo 999999999 o 912345678). Escribe un celular real.', field);
  return '+51' + d;
}
var BAD_DOMAINS = ['gmial.com', 'gmai.com', 'gmail.co', 'gamil.com', 'gmail.con', 'hotmial.com', 'hotmail.co', 'hotmail.con', 'outlok.com', 'yaho.com', 'yahoo.co', 'correo.com', 'ejemplo.com', 'test.com'];
function cleanEmail(v) {

  var dom = e.split('@')[1];
  if (BAD_DOMAINS.indexOf(dom) > -1) throw bad('El dominio "' + dom + '" no recibe correos. Revisa si está bien escrito.', 'email');
  return e;
}
function checkPassword(p, field) {
  var s = String(p || '');
  if (s.length < 8 || !/\d/.test(s) || !/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(s)) throw bad('Usa al menos 8 caracteres, con letras y números.', field || 'password');
  if (s.length > 72) throw bad('La contraseña es demasiado larga.', field || 'password');
  return s;
}
function cleanDriver(d) {
  d = d || {};
  var license = String(d.license || '').trim().toUpperCase().replace(/\s/g, '');
  if (!/^[A-Z]\d{8}$/.test(license)) throw bad('La licencia debe tener una letra y 8 números (ejemplo: Q12345678).', 'license');
  var plate = String(d.plate || '').trim().toUpperCase().replace(/\s/g, '');
  if (/^[A-Z0-9]{3}\d{3}$/.test(plate)) plate = plate.slice(0, 3) + '-' + plate.slice(3);

  var vehicle = String(d.vehicle || '').trim();

/* ---------------------------------------------------------------- Códigos de verificación (simulados) */
var onCode = function () {};
function sendCode(db, u, purpose, prefer) {
  var recent = db.otp.filter(function (o) { return o.userId === u.id && o.created > now() - 15 * 60e3; }).length;
  if (recent >= 6) throw err(429, 'Pediste muchos códigos. Espera 15 minutos e inténtalo otra vez.');
  var channel = prefer === 'email' ? 'email' : 'sms';
  var code = String(Math.floor(100000 + Math.random() * 900000));
  db.otp.push({ userId: u.id, purpose: purpose, channel: channel, code: code, expires: now() + 10 * 60e3, attempts: 0, used: false, created: now() });
  var to = channel === 'sms' ? maskPhone(u.phone) : maskEmail(u.email);

function checkCode(db, u, purpose, code) {
  code = String(code || '').replace(/\D/g, '');

  if (!row) throw bad('Pide un código nuevo.', 'code');
  if (row.expires < now()) throw bad('Este código ya venció. Pide uno nuevo.', 'code');
  if (row.attempts >= 5) throw bad('Demasiados intentos. Pide un código nuevo.', 'code');
  if (row.code !== code) { row.attempts++; save(db); throw bad('El código no es correcto. Revísalo e inténtalo otra vez.', 'code'); }
  row.used = true; return row.channel;
}

/* ---------------------------------------------------------------- Viajes: estado que avanza con el tiempo */

function makeBotOffers(r) {

  });
}
function tick(db, r) {

        if (o.price <= fin(r) * 1.2) { choose(db, r, o, o.at + BOT_CHOOSE); } else { o.status = 'rejected'; }
        changed = true;
      });
      if (r.status === 'searching' && t - r.createdAt > 75e3) { r.status = 'expired'; r.offers.forEach(function (o) { if (o.status === 'pending') o.status = 'rejected'; }); changed = true; }
    } else {

      var limit = db.sim.noDrivers && !visible ? 12e3 : (visible ? 300e3 : 120e3);

    }

  if (r.driverBot && ['accepted', 'arrived', 'in_progress'].indexOf(r.status) > -1) {
    if (r.status === 'accepted' && t >= r.acceptedAt + T_ARRIVE) { r.status = 'arrived'; r.arrivedAt = r.acceptedAt + T_ARRIVE; changed = true; }
    if (r.status === 'arrived' && t >= r.arrivedAt + T_START) { r.status = 'in_progress'; r.startedAt = r.arrivedAt + T_START; changed = true; }

function complete(r, at) { r.status = 'completed'; r.completedAt = at || now(); r.finalPrice = r.finalPrice != null ? r.finalPrice : fin(r); r.payStatus = r.payMethod === 'card' ? 'pending_card' : 'pending_driver'; }

}
function offsetPoint(p, km) { var a = Math.random() * Math.PI * 2; return { lat: p.lat + Math.sin(a) * km / 111, lng: p.lng + Math.cos(a) * km / 109 }; }

function botPos(r) {

/* ---------- Buscando conductores: llegan ofertas y el pasajero elige con quién viajar */
function offerBase() { return R.ride ? R.ride.total : 0; }
function offerScore(o) { return o.rating * 2 - o.eta * 0.25 - (o.price - offerBase()) * 0.6; }
function offerCard(o, rec) {
  var diff = Math.round((o.price - offerBase()) * 100) / 100;
  return '<div class="ofr' + (rec ? ' rec' : '') + '"><div class="ofr-top"><span class="avatar" style="width:48px;height:48px;font-size:1em">' + initials(o.name) + '</span>' +
    '<div class="who"><b>' + esc(o.name) + '</b><small>' + ic('star', 14) + ' ' + Number(o.rating).toFixed(1) + ' · ' + Number(o.trips || 0).toLocaleString('es-PE') + ' viajes</small><small>' + esc(o.vehicle + ' ' + o.color) + ' · ' + esc(o.plate) + '</small></div>' +
    '<div class="pr"><b>' + money(o.price) + '</b><small>llega en ' + o.eta + ' min</small></div></div>' +
    '<div class="tags">' + (rec ? '<span class="badge">Recomendado</span>' : '') + (diff <= 0 ? '<span class="badge d">Acepta tu precio</span>' : '<span class="badge a">' + money(diff) + ' más que tu precio</span>') + '</div>' +
    '<button class="btn btn-go" type="button" data-act="pickDriver" data-arg="' + o.id + '">Elegir a ' + esc(firstName(o.name)) + ' · ' + money(o.price) + '</button></div>';
}
SCREENS.searching = { view: function (p) {
  if (p.fail) return { title: 'Sin conductores', noBack: true, cls: 'center',
    html: '<div class="pulse" style="background:var(--amber-soft)"><div class="core" style="background:var(--amber);color:#080F1D">' + ic('car', 34) + '</div></div><h2 class="big-t">Ningún conductor respondió a tiempo</h2><p class="sub-t">Puede pasar en horas de mucho tráfico o si hay pocos conductores conectados. Puedes intentarlo otra vez, subir un poco el precio o elegir otro tipo de auto.</p>',
    foot: '<button class="btn btn-go big" type="button" data-act="retry">Intentar de nuevo</button><button class="btn btn-ghost mt8" type="button" data-act="back">Cambiar el precio o el auto</button>' };
  var offers = R.offersFor === p.id ? (R.offers || []) : [], r = R.ride || {}, L = ME.level;
  if (!offers.length) return { title: 'Buscando conductores', noBack: true, cls: 'center',
    html: '<div class="pulse"><div class="core">' + ic('car', 34) + '</div></div><h2 class="big-t" role="status">Buscando conductores cerca de ti…</h2><p class="sub-t" id="sSub">Te mostraremos quiénes pueden llevarte para que elijas.</p>',
    foot: '<button class="btn btn-ghost red" type="button" data-act="cancelSearch" id="csBtn">Cancelar búsqueda</button>' };
  var sort = R.offerSort || (L === 1 ? 'rec' : 'price'), list = offers.slice(), best = null;
  offers.forEach(function (o) { if (!best || offerScore(o) > offerScore(best)) best = o; });
  if (sort === 'price') list.sort(function (a, b) { return a.price - b.price || a.eta - b.eta; });
  else if (sort === 'eta') list.sort(function (a, b) { return a.eta - b.eta; });
  else if (sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating; });
  else list.sort(function (a, b) { return offerScore(b) - offerScore(a); });
  var h = '<p class="lead" style="margin-bottom:12px">Hacia <strong>' + esc(r.dest && r.dest.label) + '</strong>. Tu precio: <strong>' + money(offerBase()) + '</strong>. Elige con quién quieres viajar.</p>';
  if (L >= 2) h += '<div class="seg" role="radiogroup" aria-label="Ordenar conductores" style="margin-bottom:14px">' + [['price', 'Más barato'], ['eta', 'Llega antes'], ['rating', 'Mejor calificado']].map(function (x) {
    return '<button type="button" role="radio" aria-checked="' + (sort === x[0]) + '" data-act="sortOffers" data-arg="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  h += list.map(function (o) { return offerCard(o, best && o.id === best.id && list.length > 1); }).join('');
  h += Date.now() - (r.createdAt || 0) < 9000 ? '<p class="fine" role="status"><span class="online-dot"></span>Llegan más conductores…</p>' : '<p class="fine">Estos son los conductores disponibles ahora.</p>';
  return { title: 'Elige a tu conductor', noBack: true, sos: true, html: h,
    foot: '<button class="btn btn-ghost red" type="button" data-act="cancelSearch" id="csBtn">Cancelar búsqueda</button>' };
}, mount: function (p) {
  if (p.fail) return;
  if (R.offersFor !== p.id) { R.offersFor = p.id; R.offers = []; R.offerSig = ''; R.offerSort = null; }
  var t0 = Date.now();
  function poll() {
    api('/api/rides/' + p.id, { quiet: true }).then(function (d) {
      if (R.screen !== 'searching' || R.params.id !== p.id) return;
      var r = d.ride; R.ride = r;
      if (r.status === 'accepted' || r.status === 'arrived' || r.status === 'in_progress') { log('conductor_asignado', r.driver && r.driver.name); go('trip', { id: r.id }, { replace: true }); }
      else if (r.status === 'no_drivers') { log('sin_conductores'); R.params.fail = true; render(); }
      else if (r.status === 'cancelled') { go('home', {}, { reset: true }); }
      else {
        var o = r.offers || [], sig = o.map(function (x) { return x.id; }).join(',');
        var live = Date.now() - r.createdAt < 9000, wasLive = R.offerLive;
        if (sig !== R.offerSig || live !== wasLive) {
          o.forEach(function (x) { if (R.offerSig.split(',').indexOf(x.id) < 0) log('oferta_recibida', x.name + '|' + x.price); });
          R.offerSig = sig; R.offers = o; R.offerLive = live; render();
        } else if (!o.length) { var s = $('#sSub'); if (s && Date.now() - t0 > 8000) s.textContent = 'Llevas ' + Math.round((Date.now() - r.createdAt) / 1000) + ' s esperando. Te avisaremos apenas un conductor responda.'; }
      }
    }).catch(function () {});
  }
  poll(); every(poll, 1500);
} };

}, mount: function (p) {

      '<div class="driver"><span class="avatar">' + initials(d.name) + '</span><div><b>' + esc(d.name) + '</b><div style="font-size:.85em;color:var(--ink-2)">' + (d.rating ? ic('star', 14) + ' ' + d.rating + ' · ' : '') + esc(d.vehicle + ' ' + d.color) + '</div></div><div class="plate"><b>' + esc(d.plate) + '</b><small>Placa</small></div></div>' +

  }

  location.href = 'sms:' + CONTACTS.map(function (c) { return c.phone; }).join(',') + '?body=' + encodeURIComponent(text);
};
/* Conductor */
ACT.dOnline = function (on) { if (on === '0') return sheet('<h2 id="sh-t">¿Desconectarte?</h2><p>Dejarás de recibir solicitudes de viaje.</p><button class="btn btn-danger" type="button" data-act="dOfflineOk">Sí, desconectarme</button><button class="btn btn-go mt8" type="button" data-act="closeSheet">No, seguir conectado</button>'); ACT.dOnlineRaw(on); };
ACT.dOfflineOk = function () { closeSheet(); ACT.dOnlineRaw('0'); };
ACT.dOnlineRaw = function (on) {
  on = on === '1';
  var go2 = function (pos) {
    api('/api/driver/status', { method: 'POST', body: { online: on, lat: pos && pos.lat, lng: pos && pos.lng } }).then(function () {
      ME.driver.online = on; if (!on) stopDriverGps(); log('conductor_' + (on ? 'conectado' : 'desconectado')); render();
    }).catch(function (e) { toast(esc(e.error)); });
  };
  if (on) { toast('Activando tu ubicación…'); locate().then(function (p) { if (p) R.driverPos = p; else toast('Sin ubicación: verás todas las solicitudes, sin distancia.'); go2(p); }); } else go2(null);
};
ACT.dAccept = function (id, el) { var r = dReq(id); if (!r) return; log('conductor_acepta_precio', r.total); dOffer(id, 'accept', {}, el, function (p) { return 'Aceptaste ' + money(p) + '. ' + esc(r.passengerName) + ' está eligiendo a su conductor.'; }); };
ACT.dStep = function (step, el) {
  busy(el, true);
  api('/api/rides/' + R.params.id + '/' + step, { method: 'POST' }).then(function () { log('conductor_paso', step); render(); })
    .catch(function (e) { busy(el, false); toast(esc(e.error)); });
};
ACT.dCash = function (a, el) { busy(el, true); api('/api/rides/' + R.params.id + '/cash-received', { method: 'POST' }).then(function () { render(); }).catch(function (e) { busy(el, false); toast(esc(e.error)); }); };
ACT.dDone = function () { go('dHome', {}, { reset: true }); };
ACT.dCancel = function () { sheet('<h2 id="sh-t">¿Cancelar este viaje?</h2><p>El pasajero recibirá un aviso para pedir otro conductor.</p><button class="btn btn-danger" type="button" data-act="dCancelOk">Sí, cancelar</button><button class="btn btn-go mt8" type="button" data-act="closeSheet">No, seguir</button>'); };
ACT.dCancelOk = function () { api('/api/rides/' + R.params.id + '/cancel', { method: 'POST' }).then(function () { closeSheet(); stopDriverGps(); log('conductor_cancelo'); go('dHome', {}, { reset: true }); }).catch(function (e) { closeSheet(); toast(esc(e.error)); }); };

/* Cambiar el precio (nivel 1: hoja con botones grandes) */
ACT.priceSheet = function () {
  var base = R.est.prices[R.draft.svc]; R.sheetOffer = R.draft.offer != null ? R.draft.offer : base;
  sheet('<h2 id="sh-t">Cambia el precio</h2><p>Precio sugerido: <strong>' + money(base) + '</strong>. Si ofreces menos, quizá menos conductores acepten.</p>' +
    '<div class="stepper" style="margin-bottom:10px"><button type="button" data-act="offerS" data-arg="-1" aria-label="Bajar un sol">−</button><output id="offerS" aria-live="polite">' + money(R.sheetOffer) + '</output><button type="button" data-act="offerS" data-arg="1" aria-label="Subir un sol">+</button></div>' +
    '<p class="msg" id="offerMsg" style="margin:0 0 16px;text-align:center"></p>' +
    '<button class="btn btn-go" type="button" data-act="offerUse">Usar este precio</button><button class="btn btn-ghost mt8" type="button" data-act="offerSheetReset">Volver al sugerido</button>');
  ACT.offerS(0);
};
ACT.offerS = function (dl) {
  var base = R.est.prices[R.draft.svc], lo = Math.ceil(Math.max(5, base * 0.6) * 10) / 10, hi = Math.floor(base * 2 * 10) / 10;
  var nv = Math.max(lo, Math.min(hi, Math.round((R.sheetOffer + (+dl)) * 10) / 10)); R.sheetOffer = nv;
  var o = $('#offerS'), m = $('#offerMsg'); if (o) o.textContent = money(nv);
  if (m) { var low = nv < base * 0.85; m.style.fontWeight = low ? '700' : ''; m.style.color = low ? 'var(--danger)' : '';
    m.textContent = low ? 'Con un precio tan bajo es posible que ningún conductor acepte.' : (nv > base ? 'Pagarías ' + money(nv - base) + ' más que el sugerido. Más conductores querrán llevarte.' : (nv < base ? 'Pagarías ' + money(base - nv) + ' menos que el sugerido.' : 'Es el precio sugerido.')); }
};
ACT.offerUse = function () { var base = R.est.prices[R.draft.svc]; R.draft.offer = R.sheetOffer === base ? null : R.sheetOffer; log('precio_cambiado', R.draft.offer == null ? 'sugerido' : R.draft.offer); closeSheet(); paintEstimate(); toast(R.draft.offer == null ? 'Usarás el precio sugerido' : 'Tu precio: ' + money(R.draft.offer)); };
ACT.offerSheetReset = function () { R.draft.offer = null; closeSheet(); paintEstimate(); toast('Volviste al precio sugerido'); };
/* Elegir conductor */
ACT.sortOffers = function (k) { R.offerSort = k; log('ordenar_conductores', k); render(); };
ACT.pickDriver = function (id) {
  var o = (R.offers || []).filter(function (x) { return x.id === id; })[0]; if (!o) return;
  sheet('<h2 id="sh-t">¿Viajar con ' + esc(firstName(o.name)) + '?</h2>' +
    '<div class="driver"><span class="avatar">' + initials(o.name) + '</span><div><b>' + esc(o.name) + '</b><div style="font-size:.85em;color:var(--ink-2)">' + ic('star', 14) + ' ' + Number(o.rating).toFixed(1) + ' · ' + esc(o.vehicle + ' ' + o.color) + '</div></div><div class="plate"><b>' + esc(o.plate) + '</b><small>Placa</small></div></div>' +
    '<div class="kv"><span>Precio final</span><b>' + money(o.price) + '</b></div><div class="kv" style="border:0;margin-bottom:12px"><span>Llega en</span><b>' + o.eta + ' min</b></div>' +
    '<button class="btn btn-go big" type="button" data-act="confirmDriver" data-arg="' + o.id + '">Sí, viajar con ' + esc(firstName(o.name)) + '</button><button class="btn btn-ghost mt8" type="button" data-act="closeSheet">Ver otros conductores</button>');
};
ACT.confirmDriver = function (id, el) {
  var o = (R.offers || []).filter(function (x) { return x.id === id; })[0]; if (!o) return;
  var byPrice = R.offers.slice().sort(function (a, b) { return a.price - b.price; });
  busy(el, true, 'Confirmando…');
  api('/api/rides/' + R.ride.id + '/choose', { method: 'POST', body: { offerId: id } }).then(function (d) {
    log('conductor_elegido', o.name + '|' + o.price + '|puesto_precio=' + (byPrice.indexOf(o) + 1) + '|de=' + R.offers.length);
    closeSheet(); R.ride = d.ride; R.offers = []; R.offerSig = ''; go('trip', { id: d.ride.id }, { replace: true });
  }).catch(function (e) { closeSheet(); toast(esc(e.error)); R.offerSig = ''; });
};
ACT.shareTo = function (name) { closeSheet(); log('compartir_viaje', name); toast('Enviamos los datos de tu viaje a ' + esc(name)); };
/* Conductor: aceptar el precio u ofrecer otro */
function dReq(id) { return (R.dReqs || []).filter(function (r) { return String(r.id) === String(id); })[0]; }
ACT.dCounter = function (id) {
  var r = dReq(id); if (!r) return; R.dOffer = Math.round((r.total + 1) * 2) / 2;
  sheet('<h2 id="sh-t">Ofrece tu precio a ' + esc(r.passengerName) + '</h2><p>' + esc(r.passengerName) + ' ofrece ' + money(r.total) + '. Verá tu precio junto al de otros conductores y elegirá.</p>' +
    '<div class="stepper" style="margin-bottom:16px"><button type="button" data-act="dOfferStep" data-arg="-0.5" aria-label="Bajar 50 céntimos">−</button><output id="dOff" aria-live="polite">' + money(R.dOffer) + '</output><button type="button" data-act="dOfferStep" data-arg="0.5" aria-label="Subir 50 céntimos">+</button></div>' +
    '<button class="btn btn-go" type="button" data-act="dSendOffer" data-arg="' + r.id + '">Enviar mi oferta</button><button class="btn btn-ghost mt8" type="button" data-act="closeSheet">Cancelar</button>');
};
ACT.dOfferStep = function (dl) { R.dOffer = Math.max(5, Math.round((R.dOffer + (+dl)) * 2) / 2); var o = $('#dOff'); if (o) o.textContent = money(R.dOffer); };
function dOffer(id, path, body, el, msg) {
  busy(el, true, 'Enviando…');
  api('/api/rides/' + id + '/' + path, { method: 'POST', body: body }).then(function (d) {
    closeSheet(); R.seenOffers = R.seenOffers || {}; toast(msg(d.offer.price)); if (R.dPoll) R.dPoll();
  }).catch(function (e) { busy(el, false); closeSheet(); toast(esc(e.error)); if (R.dPoll) R.dPoll(); });
}
ACT.dSendOffer = function (id, el) { var r = dReq(id); if (!r) return; log('conductor_contraoferta', r.total + '->' + R.dOffer); dOffer(id, 'offer', { price: R.dOffer }, el, function (p) { return 'Enviamos tu oferta de ' + money(p) + ' a ' + esc(r.passengerName); }); };
ACT.dGoRide = function (id) { closeSheet(); go('dRide', { id: +id }, { reset: true }); };
ACT.wizNoDrivers = function () { var v = !SIM.sim().noDrivers; SIM.setSim('noDrivers', v); log('facilitador_sin_conductores', v); closeSheet(); openWizard(); };
ACT.wizReset = function () { sheet('<h2 id="sh-t">¿Borrar los datos de la demo?</h2><p>Se borran las cuentas creadas, los viajes y los lugares guardados en este navegador. Vuelven las cuentas de prueba.</p><button class="btn btn-danger" type="button" data-act="wizResetOk">Sí, borrar</button><button class="btn btn-ghost mt8" type="button" data-act="closeSheet">No, volver</button>', 'wiz'); };
ACT.wizResetOk = function () { SIM.reset(); tourClearAll(); ME = null; PLACES = []; CONTACTS = []; R.task = null; R.draft = null; R.origin = null; log('facilitador_reinicio_demo'); go('welcome', {}, { reset: true }); toast('Datos de la demo reiniciados'); };
Object.keys(ACT_LATE).forEach(function (k) { ACT[k] = ACT_LATE[k]; });

/* ======================================================= Panel del facilitador (Mago de Oz) — oculto para el participante */
function toCSV() {
  var rows = R.log.map(function (r) { return [r.t, r.pantalla, r.evento, r.detalle, r.nivel].map(function (x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }).join(','); });
  return 'fecha_hora,pantalla,evento,detalle,nivel\n' + rows.join('\n');
}
function openWizard() {
  log('panel_facilitador', 'abierto');
  var t = R.lastTask, live = R.task, pax = ME && ME.role === 'passenger';
  sheet('<h2 id="sh-t">Panel del facilitador</h2><small>Solo para quien dirige la prueba. Se abre tocando 5 veces el logo o con Shift + W.</small>' +
    (pax ? '<p class="mt16" style="margin-bottom:4px"><b>Vista del participante</b></p><div class="wizgrid">' + [1, 2, 3].map(function (n) { return '<button type="button" data-act="wizLevel" data-arg="' + n + '" aria-pressed="' + (ME.level === n) + '">Nivel ' + n + '</button>'; }).join('') + '</div>' +
      '<p style="margin-bottom:4px"><b>Adaptación automática</b></p><div class="wizrow"><button type="button" data-act="wizAuto" data-arg="auto" aria-pressed="' + (ME.mode === 'auto') + '">Activada</button><button type="button" data-act="wizAuto" data-arg="off" aria-pressed="' + (ME.mode !== 'auto') + '">Desactivada</button></div>' +
      '<p style="margin-bottom:4px"><b>Forzar mensaje de adaptación</b></p><div class="wizrow"><button type="button" data-act="wizPend" data-arg="up">Subir al volver al inicio</button><button type="button" data-act="wizPend" data-arg="down">Bajar al volver al inicio</button></div>'
      : '<p class="mt16">Inicia sesión con una cuenta de pasajero para controlar la vista adaptativa.</p>') +
    '<p style="margin-bottom:4px"><b>Modo estudio</b></p><div class="wizrow"><button type="button" data-act="wizStudy" aria-pressed="' + R.studyMode + '">SOS simulado (no marca al 105)</button></div>' +
    '<p style="margin-bottom:4px"><b>Simulación</b></p><div class="wizrow"><button type="button" data-act="wizNoDrivers" aria-pressed="' + !!SIM.sim().noDrivers + '">Simular que no hay conductores</button></div>' +
    '<small>Cuentas de prueba (contraseña Drivu2026): demo@drivu.pe (adulta mayor, nivel 1) · joven@drivu.pe (nivel 3) · conductor@drivu.pe. Para emparejar a un pasajero con un conductor real, abre el prototipo en otra pestaña e inicia sesión como conductor.</small>' +
    '<p style="margin-bottom:4px"><b>Tarea en curso</b></p><small>' + (live ? esc(live.name) + ' · ' + ((Date.now() - live.start) / 1000).toFixed(0) + ' s · atrás ' + live.backs + ' · toques fuera ' + live.misses + ' · errores ' + live.errors : 'Ninguna') + '</small>' +
    '<p style="margin:10px 0 4px"><b>Última tarea terminada</b></p><small>' + (t ? esc(t.name) + ' · ' + (t.ms / 1000).toFixed(1) + ' s · atrás ' + t.backs + ' · toques fuera ' + t.misses + ' · errores ' + t.errors + ' · ayuda ' + t.help : 'Aún no hay') + '</small>' +
    '<p style="margin:12px 0 4px"><b>Registro de esta sesión (' + R.log.length + ' eventos)</b></p><textarea id="wlog" readonly aria-label="Registro de eventos en formato CSV">' + esc(toCSV()) + '</textarea>' +
    '<div class="wizrow"><button type="button" data-act="wizCopy">Copiar CSV</button><button type="button" data-act="wizClearLog">Nuevo participante</button></div>' +
    (ME && ME.admin ? '<div class="wizrow"><button type="button" data-act="wizServerCsv">Descargar CSV de todas las sesiones</button></div>' : '') +
    '<div class="wizrow"><button type="button" data-act="wizReset">Borrar datos de la demo</button><button type="button" data-act="closeSheet">Cerrar panel</button></div>', 'wiz');
}
ACT.wizLevel = function (n) { saveMe({ level: +n }); log('facilitador_nivel', n); closeSheet(); render(); openWizard(); };
ACT.wizAuto = function (v) { saveMe({ mode: v === 'auto' ? 'auto' : 'fixed' }); log('facilitador_auto', v); closeSheet(); render(); openWizard(); };
ACT.wizPend = function (d) { var L = ME.level; R.pendingAdapt = d === 'up' ? (L < 3 ? { from: L, to: L + 1 } : null) : (L > 1 ? { from: L, to: L - 1 } : null); log('facilitador_forzar', d); closeSheet(); if (R.screen === 'home' && R.pendingAdapt) showAdapt(); else toast('Se mostrará al volver al inicio'); };
ACT.wizStudy = function () { R.studyMode = !R.studyMode; log('facilitador_modo_estudio', R.studyMode); closeSheet(); openWizard(); };
ACT.wizCopy = function () { var ta = $('#wlog'), txt = toCSV(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Registro copiado'); }, function () { ta.select(); toast('Selecciona el texto y cópialo'); }); else { ta.select(); toast('Selecciona el texto y cópialo'); } };
ACT.wizClearLog = function () { flushLog(); R.log = []; R.task = null; R.lastTask = null; R.session = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); log('nuevo_participante'); closeSheet(); toast('Listo para un nuevo participante'); };
ACT.wizServerCsv = function () { flushLog(); window.open('/api/admin/events.csv', '_blank'); };

/* ======================================================= Eventos globales */
var device = document.getElementById('device');
device.addEventListener('click', function (e) {
  var link = e.target.closest('a[data-log]'); if (link) log(link.getAttribute('data-log'));
  var t = e.target.closest('[data-act]');
  if (!t) {
    if (app.contains(e.target) && !e.target.closest('button,a,input,label,select,textarea,summary,details,[role],.leaflet-container')) track('toque_fuera', R.screen);
    return;
  }
  if (t.disabled) return;
  var fn = ACT[t.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(t.getAttribute('data-arg'), t, e); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && R.sheetOpen) { closeSheet(); return; }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  if (!typing && e.shiftKey && (e.key === 'W' || e.key === 'w')) { e.preventDefault(); openWizard(); }
});

/* ======================================================= Inicio */
Promise.all([api('/api/config').catch(function () { return {}; }), api('/api/me', { quiet: true }).catch(function () { return { user: null }; })]).then(function (res) {
  CFG = res[0] || {}; ME = res[1].user;
  if (!ME) return go('welcome', {}, { reset: true });
  loadMine().then(function () { go(ME.phone ? homeScreen() : 'completeProfile', {}, { reset: true }); });
});
})();

</script>
<script>
(function(){var d=document.getElementById('device');if(!d)return;
function fit(){var narrow=innerWidth<=520,H=narrow?innerHeight:innerHeight-32,s=Math.min(1,H/760);
d.style.zoom=s;
if(narrow){d.style.width=(innerWidth/s)+'px';d.style.height=(innerHeight/s)+'px';}
else{d.style.width='390px';d.style.height=Math.min(844,H/s)+'px';}}
fit();addEventListener('resize',fit);})();
</script>
<script>
(function(){var SEL='.btn,.dest,.fav,.chip,.fab,.nav button,.icon-btn,.originbar,.paychip,.searchbar,.acct,.sos,.lvl,.star,.backbtn';
document.addEventListener('pointerdown',function(e){var t=e.target.closest&&e.target.closest(SEL);if(!t||t.disabled)return;
var r=t.getBoundingClientRect(),z=parseFloat((document.getElementById('device')||{style:{}}).style.zoom)||1,d=Math.max(r.width,r.height)*2.2,
x=(e.clientX-r.left)/z,y=(e.clientY-r.top)/z,s=document.createElement('span');s.className='rip';
s.style.cssText='width:'+d/z+'px;height:'+d/z+'px;left:'+(x-d/z/2)+'px;top:'+(y-d/z/2)+'px';t.appendChild(s);setTimeout(function(){s.remove()},600);},true);
document.addEventListener('pointerup',function(e){var t=e.target.closest&&e.target.closest(SEL);if(!t)return;t.classList.remove('bounce');void t.offsetWidth;t.classList.add('bounce');setTimeout(function(){t.classList.remove('bounce')},420);},true);
})();
</script>
<script>
(function(){var r=document.documentElement;
try{var sv=localStorage.getItem('drivu-theme');if(sv&&sv!=='auto')r.setAttribute('data-theme',sv);}catch(e){}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-set]');if(!b)return;

try{localStorage.setItem('drivu-theme',v);}catch(x){}
[].forEach.call(document.querySelectorAll('[data-theme-set]'),function(o){o.setAttribute('aria-checked',o===b?'true':'false');});},true);
})();
</script>
<script>
(function(){var ov=document.getElementById('overlay'),sh=null,y0=0,t0=0,dy=0,on=false,zm=1;
function zoom(){return parseFloat((document.getElementById('device')||{style:{}}).style.zoom)||1;}
ov.addEventListener('pointerdown',function(e){sh=ov.querySelector('.sheet');if(!sh||!sh.contains(e.target))return;
var r=sh.getBoundingClientRect(),fromHandle=(e.clientY-r.top)<48;
if(!fromHandle&&sh.scrollTop>0)return;if(e.target.closest('input,textarea,select'))return;
y0=e.clientY;t0=Date.now();dy=0;on=true;zm=zoom();sh.style.transition='none';},true);
window.addEventListener('pointermove',function(e){if(!on||!sh)return;dy=(e.clientY-y0)/zm;if(dy<0)dy=dy/4;
if(Math.abs(dy)>6){sh.style.transform='translateY('+Math.max(dy,-20)+'px)';var bd=ov.querySelector('.backdrop');if(bd)bd.style.opacity=Math.max(.15,1-Math.max(dy,0)/(sh.offsetHeight||400));}},true);
function end(){if(!on||!sh)return;on=false;var v=dy/Math.max(Date.now()-t0,1),s=sh;s.style.transition='transform .28s cubic-bezier(.2,.9,.3,1)';
if(dy>110||(dy>40&&v>.6)){s.style.transform='translateY(110%)';var bd=ov.querySelector('.backdrop');setTimeout(function(){if(bd)bd.click();else if(ov.classList)ov.classList.remove('open');},230);}
else{s.style.transform='';var b2=ov.querySelector('.backdrop');if(b2)b2.style.opacity='';}
if(Math.abs(dy)>6){var stop=function(ev){ev.stopPropagation();ev.preventDefault();};window.addEventListener('click',stop,{capture:true,once:true});setTimeout(function(){window.removeEventListener('click',stop,true);},50);}
sh=null;}
window.addEventListener('pointerup',end,true);window.addEventListener('pointercancel',end,true);
})();
</script><script>(function(){var t=document.getElementById('toast');if(t)t.addEventListener('click',function(e){if(e.target.closest('.toast-act'))return;t.classList.remove('show');});})();</script><script>(function(){function chk(){var m=document.getElementById('main');if(!m)return;var more=m.scrollHeight>m.clientHeight+6&&m.scrollTop+m.clientHeight<m.scrollHeight-8;m.classList.toggle('more',more);}
document.addEventListener('scroll',chk,true);addEventListener('resize',chk);new MutationObserver(function(){chk();setTimeout(chk,300);}).observe(document.getElementById('app'),{childList:true,subtree:true});setInterval(chk,700);})();</script>
